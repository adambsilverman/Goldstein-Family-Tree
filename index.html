<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Tree</title>
<meta name="description" content="The Goldstein family tree: explore, and add what you know.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Goldstein Family Tree · one-file app. Data lives in the browser (this device) or a shared
     Firebase Realtime Database (family link). Starting data: private/goldstein-seed.js, which is
     kept only on Adam's Mac and never uploaded. Source of truth for code: this file. -->
<style>
:root{
  --paper:#f6f1e7; --paper2:#efe7d8; --card:#fffdf8; --ink:#2a231d; --muted:#6b6056; --line:#e2d8c6;
  --accent:#1f5c5a; --accent2:#174745; --warn:#a4501f; --ok:#2e7d4f; --sel:#f2c14e;
  --b0:#b5523b; --b1:#3f7d6e; --b2:#4a6aa5; --b3:#a06a1f; --b4:#7b5aa6; --b5:#2f8a9a; --b6:#b0476f; --bx:#8a8178;
  --r:0; --shadow:3px 3px 0 #2a231d14;
  font-size:16px;
}
body.big{font-size:19px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,.serif{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;letter-spacing:-.015em}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{margin:0;font-size:1.35rem;line-height:1.1;white-space:nowrap}
.brand small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:9px 14px 9px 36px;border-radius:0;border:1.5px solid var(--line);background:var(--paper)}
.search input:focus{outline:none;border-color:var(--accent);background:#fff}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:0;box-shadow:var(--shadow);
  max-height:60vh;overflow:auto;z-index:30;display:none}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 14px;cursor:pointer}
.results button:hover,.results button.hi{background:var(--paper2)}
.results .ctx{display:block;color:var(--muted);font-size:.82rem}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:0;padding:7px 12px;cursor:pointer;white-space:nowrap;font-size:.9rem}
.pill:hover{border-color:var(--accent)}
.pill.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.primary:hover{background:var(--accent2)}
.dot{width:9px;height:9px;border-radius:0;background:var(--bx);flex:none}
.dot.live{background:#2e9d5a;box-shadow:0 0 0 2px #2e9d5a33}
.dot.busy{background:var(--sel)}
.dot.off{background:var(--warn)}

nav.tabs{display:flex;align-items:center;gap:10px;padding:6px 12px 0;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.tabscroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabscroll::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:9px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.sh{display:none}
nav.tabs .navadd{flex:none;border:1.5px solid var(--accent);background:var(--accent);color:#fff;padding:7px 14px;margin-bottom:5px;font-weight:600;white-space:nowrap}
nav.tabs .navadd:hover{background:var(--accent2)}
nav.tabs button .n{display:inline-block;background:var(--warn);color:#fff;border-radius:0;font-size:.72rem;padding:0 7px;margin-left:5px;vertical-align:1px}

main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none}
.view.on{display:block}
.view.canvas{overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#d9cdb733 1px,transparent 0) 0 0/22px 22px,var(--paper)}
.pad{max-width:1000px;margin:0 auto;padding:22px 18px 80px}

/* ---------- canvas views ---------- */
svg.stage{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg.stage.drag{cursor:grabbing}
.tools{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:4}
.tools button,.ctool{width:42px;height:42px;border-radius:0;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-size:1.2rem;display:grid;place-items:center}
.tools button:hover{border-color:var(--accent)}
.ctools{position:absolute;left:14px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:4}
.ctools .pill{background:var(--card);box-shadow:var(--shadow)}
.legend{position:absolute;left:14px;bottom:14px;background:#fffdf8e6;border:1px solid var(--line);border-radius:0;padding:8px 12px;font-size:.8rem;z-index:3;max-width:calc(100% - 90px)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:0;display:inline-block}

.node rect.box{fill:#fffdf8;stroke:var(--line);stroke-width:1.2}
.node:hover rect.box{stroke:var(--accent)}
.node.sel rect.box{stroke:var(--ink);stroke-width:2.5}
.node.me rect.box{fill:#fff6dd}
.node text{font-family:"IBM Plex Sans",sans-serif;fill:var(--ink)}
.node .tg rect{fill:#fff;stroke:var(--line)}
.node .tg:hover rect{stroke:var(--accent)}
.node .nm{font-weight:600;font-size:14px}
.node .yr{font-size:11.5px;fill:var(--muted)}
.node .sp{font-size:12px;fill:#4a4038}
.node .tg circle{fill:#fff;stroke:var(--line)}
.node .tg:hover circle{stroke:var(--accent)}
.node .tg text{font-size:11px;font-weight:700;fill:var(--muted);text-anchor:middle}
.node .unc{font-size:12px;font-weight:700;fill:var(--warn)}
.link{fill:none;stroke-width:1.6;opacity:.55}
.fan .lbl{font-size:12px;font-family:"IBM Plex Sans",sans-serif;fill:var(--ink);cursor:pointer}
.fan .lbl:hover{text-decoration:underline}
.fan .lbl.d1{font-family:"IBM Plex Serif",serif;font-weight:700;font-size:17px}
.fan .lbl.sel{font-weight:700;fill:#000}
.fan .lbl.me{fill:#9a5b00;font-weight:700}
.fan rect.n{stroke:#fff;stroke-width:1.5;cursor:pointer}
.flash{animation:flash 1.6s ease 2}
@keyframes flash{50%{opacity:.25}}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:0;box-shadow:var(--shadow)}
.pc{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:0;background:var(--card);border:1px solid var(--line);
  cursor:pointer;text-align:left;min-width:0;width:100%;border-left:5px solid var(--bc,var(--bx))}
.pc:hover{border-color:var(--accent);border-left-color:var(--bc,var(--bx))}
.pc .t{min-width:0}
.pc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc small{display:block;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:0;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--bc,var(--bx));
  font-family:"IBM Plex Serif",serif;font-size:1.05rem;background-size:cover;background-position:center}
.av.lg{width:96px;height:96px;font-size:2.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sec{margin:22px 0 8px;font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:0;padding:5px 12px;cursor:pointer;margin:0 6px 6px 0;font-size:.92rem}
.chip:hover{border-color:var(--accent)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:0;background:var(--paper2);color:var(--muted);vertical-align:2px}
.badge.warn{background:#fbe6d6;color:var(--warn)}
.badge.me{background:#fff0c2;color:#7a5200}
.rel{color:#7a5200;font-weight:700}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:0;padding:8px 14px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:#a3271b}
.btn.danger:hover{border-color:#a3271b}
.btn.sm{padding:4px 10px;font-size:.85rem;border-radius:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}

/* family view */
.fam-hero{display:flex;gap:20px;align-items:center;padding:22px;flex-wrap:wrap}
.fam-hero h2{margin:0;font-size:2rem;line-height:1.1}
.fam-hero .meta{color:var(--muted);margin-top:4px}
.fam-hero .acts{margin-left:auto}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:.9rem}
.crumbs button{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;text-decoration:underline}
.union{padding:14px;margin-bottom:12px}
.union h4{margin:0 0 10px;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warnbox{background:#fbefe4;border:1px solid #efcfb4;color:#6b3410;border-radius:0;padding:10px 14px;margin:10px 0}

/* list view */
.outline ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)}
.outline>ul{padding-left:0;border:0}
.outline li{margin:2px 0}
.outline .ln{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:3px 6px;border-radius:0}
.outline .ln:hover{background:var(--paper2)}
.outline .tw{border:0;background:none;width:22px;cursor:pointer;color:var(--muted);flex:none;padding:0}
.outline .nm{border:0;background:none;padding:0;font-weight:700;cursor:pointer;text-align:left}
.outline .nm:hover{text-decoration:underline}
.outline .sp,.outline .yr{color:var(--muted);font-size:.9rem}
.outline mark{background:#f9e3a0;border-radius:0}
.outline .bh{font-family:"IBM Plex Serif",serif;font-size:1.15rem}

/* related */
.pick{position:relative}
.pick input{width:100%;padding:10px 14px;border-radius:0;border:1.5px solid var(--line);background:#fff}
.relbig{font-family:"IBM Plex Serif",serif;font-size:1.6rem;line-height:1.25;margin:0}
.ladder{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:16px}
.ladder .top{grid-column:1/-1;justify-self:center;max-width:420px;width:100%}
.ladder .col{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.ladder .arrow{text-align:center;color:var(--muted);font-size:.9rem;line-height:1}

/* timeline */
.tl text{font-size:12px;font-family:"IBM Plex Sans",sans-serif}

/* help fill-in */
.stat{padding:14px 16px}
.stat b{font-family:"IBM Plex Serif",serif;font-size:1.7rem;display:block;line-height:1.1}
.bar{height:8px;border-radius:0;background:var(--paper2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
table.quick{width:100%;border-collapse:collapse}
table.quick td,table.quick th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.quick th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.quick input[type=text]{width:100%;min-width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:0;background:#fff}
table.quick input.saved{border-color:var(--ok);background:#effaf2}
.log li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}

/* ---------- side panel ---------- */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-4px 0 0 #2a231d10;
  transform:translateX(105%);transition:transform .22s ease;z-index:20;overflow:auto;padding:18px}
#panel.open{transform:none}
#panel .x{position:absolute;right:10px;top:10px}
.iconbtn{border:0;background:none;font-size:1.4rem;cursor:pointer;width:38px;height:38px;border-radius:0;color:var(--muted)}
.iconbtn:hover{background:var(--paper2);color:var(--ink)}

/* ---------- dialogs ---------- */
dialog{border:0;border-radius:0;padding:0;max-width:min(680px,96vw);width:100%;background:var(--card);color:var(--ink);box-shadow:8px 8px 0 #2a231d33}
dialog::backdrop{background:#2a231d66}
dialog .dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
dialog .dh h3{margin:0;font-size:1.3rem;flex:1}
dialog .db{padding:16px 20px;max-height:72vh;overflow:auto}
dialog .df{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:700;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:0;background:#fff;font-weight:400;color:var(--ink);font-size:1rem}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--accent)}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:400;font-size:1rem}
.conn{border:1px solid var(--line);border-radius:0;padding:10px 12px;margin:8px 0;background:var(--paper)}
.conn .row{justify-content:space-between}
.kids{margin:8px 0 0;padding:0;list-style:none}
.kids li{display:flex;gap:6px;align-items:center;padding:3px 0}
.kids li span{flex:1}
.qr{display:grid;place-items:center;padding:10px;background:#fff;border-radius:0;border:1px solid var(--line)}
.qr svg{width:min(260px,70vw);height:auto}
.steps{padding-left:20px}
.steps li{margin:6px 0}
code{background:var(--paper2);padding:1px 5px;border-radius:0;font-size:.88em;word-break:break-all}
pre.code{background:var(--paper2);padding:10px 12px;border-radius:0;font-size:.82rem;white-space:pre-wrap;word-break:break-all;user-select:all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:0;
  transition:transform .25s ease;z-index:100;font-size:.95rem;max-width:90vw}
.toast.on{transform:translateX(-50%)}
.toast button{background:none;border:0;color:var(--sel);font-weight:700;cursor:pointer;margin-left:10px}
.menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:0;box-shadow:var(--shadow);min-width:230px;z-index:40;display:none;padding:6px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:0;cursor:pointer}
.menu button:hover{background:var(--paper2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}

.welcome{max-width:560px;margin:8vh auto;padding:30px}
.welcome h2{font-size:2rem;margin:0 0 8px}

@media (max-width:700px){
  .brand small{display:none}
  .brand h1{font-size:1.1rem}
  header.top{gap:8px;padding:8px 10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .hbtns .lbl{display:none}
  .hbtns .sh{display:inline}
  .hbtns .pill{padding:7px 10px}
  #undoBtn{display:none!important}
  nav.tabs{padding-left:4px;padding-right:8px}
  nav.tabs .navadd{padding:6px 10px}
  .form{grid-template-columns:1fr}
  dialog{max-width:100vw;max-height:100vh;height:100%;border-radius:0;margin:0}
  dialog .db{max-height:none;flex:1}
  dialog[open]{display:flex;flex-direction:column}
  .fam-hero h2{font-size:1.5rem}
  .ladder{grid-template-columns:1fr}
  .legend{display:none}
}
/* photo crop & viewer */
.av[data-zoom]{cursor:zoom-in}
.crop{position:relative;width:min(340px,78vw);aspect-ratio:1;overflow:hidden;background:#1d1a17;margin:0 auto;touch-action:none;cursor:grab}
.crop.drag{cursor:grabbing}
.crop img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.cropgrid{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px #fff;
  background:linear-gradient(#ffffff59,#ffffff59) 33.33% 0/1px 100% no-repeat,linear-gradient(#ffffff59,#ffffff59) 66.66% 0/1px 100% no-repeat,
  linear-gradient(#ffffff59,#ffffff59) 0 33.33%/100% 1px no-repeat,linear-gradient(#ffffff59,#ffffff59) 0 66.66%/100% 1px no-repeat}
.zoomrow{display:flex;gap:10px;align-items:center;width:min(340px,78vw);margin:14px auto 0}
.zoomrow input{flex:1;accent-color:var(--accent)}
dialog#lightbox{max-width:100vw;max-height:100vh;width:100vw;height:100vh;margin:0;padding:0;background:#111;color:#fff;box-shadow:none;display:none}
dialog#lightbox[open]{display:grid;place-items:center;overflow:auto}
dialog#lightbox::backdrop{background:#000a}
#lightbox figure{margin:0;padding:56px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:100%;justify-content:center;box-sizing:border-box}
#lightbox img{max-width:calc(100vw - 32px);max-height:calc(100vh - 120px);object-fit:contain;cursor:zoom-in;background:#000}
#lightbox.actual img{max-width:none;max-height:none;cursor:zoom-out}
#lightbox figcaption{font-size:1rem;color:#ddd;text-align:center}
#lightbox .lbx{position:fixed;top:10px;right:12px;color:#fff;background:#0006;z-index:2}
#lightbox .lbx:hover{background:#000a;color:#fff}
@media print{
  header.top,nav.tabs,.tools,.ctools,#panel,.legend{display:none!important}
  body{overflow:visible;display:block;height:auto}
  main,.view.on{position:static;overflow:visible}
}
@media (prefers-reduced-motion:reduce){#panel,.toast{transition:none}.flash{animation:none}}

/* how are we related */
.relpick{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.relbox{min-width:0}
.relhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.82rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-height:30px}
.relchosen{display:flex;gap:6px;align-items:center}
.relchosen .pc{flex:1}
.pick input{padding:14px 14px;font-size:1.05rem}
.relswap{height:52px;width:52px;padding:0;font-size:1.3rem}
.relresult{padding:22px;margin-top:18px;border-left:6px solid var(--accent)}
@media (max-width:700px){.relpick{grid-template-columns:1fr}.relswap{justify-self:center;height:40px;width:52px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1 id="title">Family Tree</h1><small id="subtitle"></small></div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find someone…" autocomplete="off" aria-label="Find a person" role="combobox" aria-expanded="false" aria-controls="qres">
    <div class="results" id="qres" role="listbox"></div>
  </div>
  <div class="hbtns">
    <button class="pill" id="relBtn" title="How are two people related?"><span class="lbl">How related?</span><span class="sh">Related</span></button>
    <button class="pill" id="meBtn" title="Tell the tree who you are"><span id="meLbl">Who are you?</span></button>
    <button class="pill" id="syncBtn" title="Sharing and saving"><span class="dot" id="syncDot"></span><span class="lbl" id="syncLbl">On this device</span></button>
    <button class="pill" id="undoBtn" title="Undo" disabled hidden>Undo</button>
    <div style="position:relative">
      <button class="pill" id="menuBtn" aria-haspopup="true" aria-expanded="false" title="More options">Menu</button>

<script>

/* ================================================================

const $ = (s, r = document) => r.querySelector(s);

const LS = {
  get(k, d = null) { try { const v = localStorage.getItem('gft.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

const rid = (pre, n = 8) => { const a = 'abcdefghijkmnopqrstuvwxyz23456789'; let s = ''; const r = crypto.getRandomValues(new Uint8Array(n)); for (const x of r) s += a[x % a.length]; return pre + s; };

let T = null;                     // the tree
const IX = { parentU: {}, unionsOf: {}, branch: {}, depth: {}, blood: new Set(), root: null, top: [] };
const BR = ['--b0', '--b1', '--b2', '--b3', '--b4', '--b5', '--b6'];
const brColor = pid => { const b = IX.branch[pid]; return b == null || b < 0 ? 'var(--bx)' : `var(${BR[b % BR.length]})`; };

/* ---------- normalising (Firebase turns arrays into objects and drops empty ones) ---------- */
const arr = x => Array.isArray(x) ? x.filter(v => v != null) : (x && typeof x === 'object') ? Object.keys(x).sort((a, b) => a - b).map(k => x[k]).filter(v => v != null) : [];
const PF = ['given', 'middle', 'surname', 'birthSurname', 'nick', 'sex', 'birth', 'birthPlace', 'death', 'deathPlace', 'notes', 'photo', 'photoV'];
function normPerson(p, id) { p = p || {}; p.id = id; for (const f of PF) if (typeof p[f] !== 'string') p[f] = p[f] == null ? '' : String(p[f]); p.deceased = !!p.deceased || !!p.death; p.parentsUncertain = !!p.parentsUncertain; return p; }

function normTree(t) {
  t = t || {}; t.meta = t.meta || {}; t.people = t.people || {}; t.unions = t.unions || {}; t.log = t.log || {};

  for (const id in t.unions) t.unions[id] = normUnion(t.unions[id], id);

}

/* ---------- indexes ---------- */
function reindex() {

  let r = T.root, guard = 0;

  IX.top = [];

    if (seen.has(pid)) return; seen.add(pid);

const unionsOf = pid => (IX.unionsOf[pid] || []).map(u => T.unions[u]);
const spousesIn = (u, pid) => u.partners.filter(p => p !== pid);
const spouses = pid => unionsOf(pid).flatMap(u => spousesIn(u, pid));
const childrenOf = pid => unionsOf(pid).flatMap(u => u.children);

const parentUnion = pid => T.unions[IX.parentU[pid]] || null;

/* ---------- names & dates ---------- */
const P = id => T.people[id];

}
const initials = p => ((p.given || '?')[0] + (p.surname ? p.surname[0] : '')).toUpperCase();
function yearOf(s) { const m = String(s || '').match(/\b(1[5-9]\d\d|20\d\d)\b/); return m ? +m[1] : null; }

}

function context(pid) {

/* ---------- relationships ---------- */
function ancestorsMap(pid) { // id -> {d, via: next id towards pid}

const ORD = ['', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth'];
const TIMES = ['', 'once', 'twice', 'three times', 'four times', 'five times', 'six times'];

    return greats(db - 2) + 'grand' + sexWord(B, 'daughter', 'son', 'child');

  if (db === 0) {

// What is b to a?  -> {kind, term, via, r}; use describeRel() to turn it into words.

/* ================================================================

let conn = LS.get('conn');            // {db:"https://x.firebaseio.com", key:"…"}

  const seen = new Set();
  const item = (id, d) => {
    seen.add(id);
    if (q && !keep.has(id) && !spouses(id).some(s => match.has(s))) return '';
    const p = P(id), kids = childrenOf(id).filter(c => !seen.has(c));
    const sp = spouses(id).map(s => hl(shortName(s)) + (lifeYears(s) ? ` <span class="yr">${lifeYears(s)}</span>` : ''));
    const inner = kids.map(c => item(c, d + 1)).join('');
    const open = q ? true : !(state.listClosed || new Set()).has(id) && d < 2;
    return `<li data-id="${id}"><div class="ln">${kids.length ? `<button class="tw" data-tw="${id}" aria-expanded="${open}">${open ? '▾' : '▸'}</button>` : '<span class="tw"></span>'}
      <button class="nm${d === 1 ? ' bh' : ''}" data-panel="${id}">${hl(shortName(p))}</button>${p.nick ? `<span class="yr">(${hl(p.nick)})</span>` : ''}<span class="yr">${lifeYears(p)}</span>
      ${sp.length ? `<span class="sp">m. ${sp.join('; ')}</span>` : ''}${p.parentsUncertain ? ' <span class="badge warn" title="Which marriage?">?</span>' : ''}</div>
      ${inner ? `<ul${open ? '' : ' hidden'}>${inner}</ul>` : ''}</li>`;
  };
  $('#outline').innerHTML = IX.root ? `<ul>${item(IX.root, 0)}</ul>` + (q && !match.size ? '<p class="empty">No one by that name.</p>' : '') : '';
}

/* ---------- TIMELINE ---------- */
function renderTimeline() {
  const pad = $('#tlPad');
  const ppl = Object.values(T.people).map(p => ({ p, b: yearOf(p.birth), d: yearOf(p.death) })).filter(x => x.b);
  const total = Object.keys(T.people).length;
  if (ppl.length < 2) {
    pad.innerHTML = `<div class="empty" style="max-width:560px;margin:0 auto"><h2>The timeline fills in as birth years are added</h2><p>${ppl.length} of ${total} people have a birth year so far. Even a guess like “about 1890” helps.</p><button class="btn primary" data-view-go="help">Add dates now</button></div>`;
    return;
  }
  ppl.sort((a, b) => a.b - b.b);
  const now = new Date().getFullYear();
  const y0 = Math.floor((ppl[0].b - 5) / 10) * 10, y1 = now + 3;
  const LW = 190, RH = 24, W = Math.max(700, pad.clientWidth - 40), X = y => LW + (y - y0) / (y1 - y0) * (W - LW - 20);
  let s = `<h2 style="margin:0 0 4px">Timeline</h2><p class="muted" style="margin:0 0 12px">${ppl.length} of ${total} people have a birth year. Tap a name for details.</p><svg class="tl" width="${W}" height="${ppl.length * RH + 40}" style="display:block">`;
  for (let y = Math.ceil(y0 / 10) * 10; y <= y1; y += 10) s += `<line x1="${X(y)}" x2="${X(y)}" y1="20" y2="${ppl.length * RH + 30}" stroke="${y % 50 ? '#e8dfcf' : '#cfc2aa'}"/><text x="${X(y)}" y="14" text-anchor="middle" fill="#6b6056">${y}</text>`;
  ppl.forEach((x, i) => {
    const y = 28 + i * RH, end = x.d || (x.p.deceased ? null : now);
    s += `<text x="${LW - 8}" y="${y + 12}" text-anchor="end" data-panel="${x.p.id}" style="cursor:pointer">${esc(trunc(shortName(x.p), 26))}</text>`;
    if (end) s += `<rect x="${X(x.b)}" y="${y + 2}" width="${Math.max(4, X(end) - X(x.b))}" height="14" fill="${brColor(x.p.id)}" opacity="${x.d || !x.p.deceased ? .85 : .35}" data-panel="${x.p.id}" style="cursor:pointer"><title>${esc(fullName(x.p))} ${lifeYears(x.p)}</title></rect>`;
    else s += `<rect x="${X(x.b) - 6}" y="${y + 3}" width="12" height="12" fill="${brColor(x.p.id)}" data-panel="${x.p.id}"/>`;
  });
  pad.innerHTML = s + '</svg>';
}

/* ---------- FILL IN THE GAPS ---------- */
state.helpBranch = 'all'; state.helpMissing = true;
function gaps() {
  const all = Object.values(T.people);
  const reach = new Set(IX.blood); for (const id of IX.blood) for (const s of spouses(id)) reach.add(s);
  return {
    all, withBirth: all.filter(p => p.birth).length,
    uncertain: all.filter(p => p.parentsUncertain),
    orphans: all.filter(p => !reach.has(p.id) && !spouses(p.id).length && !IX.parentU[p.id] && !childrenOf(p.id).length)
  };
}

    for (const bl in byParent) {
      h += `<div class="card" style="padding:12px 14px;margin-bottom:10px"><b>${esc(shortName(bl))}’s children</b> <span class="muted">· ${esc(context(bl))}</span>`;
      for (const c of byParent[bl]) h += `<div class="row" style="margin-top:8px;justify-content:space-between"><span><button class="nm btn sm" data-panel="${c}" style="border:0;padding:0;background:none;text-decoration:underline">${esc(shortName(c))}</button></span><span class="row">${unionsOf(bl).map(u => `<button class="btn sm" data-act="setParents" data-id="${c}" data-u="${u.id}">with ${esc(spousesIn(u, bl).map(x => shortName(x)).join(' & ') || 'unknown')}</button>`).join('')}</span></div>`;
      h += `</div>`;
    }
  }
  h += `<div class="sec">Quick dates</div>
    <div class="row" style="margin-bottom:8px"><select id="hb" class="btn sm">${['<option value="all">Everyone</option>', ...IX.top.map((id, i) => `<option value="${i}"${state.helpBranch == i ? ' selected' : ''}>${esc(P(id).given)}’s branch</option>`)].join('')}</select>
    <label class="row" style="gap:6px"><input type="checkbox" id="hm"${state.helpMissing ? ' checked' : ''}> only people missing a birth date</label></div>
    <p class="muted" style="margin-top:0;font-size:.9rem">Any format works: “1931”, “about 1890”, “March 4, 1952”.</p>
    <div style="overflow-x:auto"><table class="quick"><thead><tr><th>Name</th><th>Born</th><th>Died</th><th></th></tr></thead><tbody>`;
  const order = []; const seen = new Set(); const walk = id => { if (seen.has(id)) return; seen.add(id); order.push(id); for (const s of spouses(id)) if (!seen.has(s)) { seen.add(s); order.push(s); } for (const c of childrenOf(id)) walk(c); }; if (IX.root) walk(IX.root);
  for (const id in T.people) if (!seen.has(id)) order.push(id);
  let shown = 0;
  for (const id of order) {
    const p = P(id);
    if (state.helpBranch !== 'all' && IX.branch[id] != state.helpBranch) continue;
    if (state.helpMissing && p.birth) continue;

    h += `<tr data-id="${id}"><td><button class="nm" data-panel="${id}" style="border:0;background:none;padding:0;font-weight:700;cursor:pointer;text-align:left">${esc(shortName(p))}</button><br><small class="muted">${esc(context(id))}</small></td>
      <td><input type="text" data-q="birth" value="${esc(p.birth)}" placeholder="born…" aria-label="Birth date of ${esc(shortName(p))}"></td>
      <td><input type="text" data-q="death" value="${esc(p.death)}" placeholder="${p.deceased ? 'died…' : '(living)'}" aria-label="Death date of ${esc(shortName(p))}"></td>

  if (G.orphans.length) h += `<div class="sec">Not connected to anyone (${G.orphans.length})</div><div class="grid">${G.orphans.map(p => pcard(p.id, 'tap to connect')).join('')}</div>`;

}
function logHTML(n) {

  return `<ul class="log" style="list-style:none;padding:0;margin:0">${L.map(e => `<li><b>${esc(e.who)}</b> ${esc(e.msg.replace(/^./, c => c.toLowerCase()))} <span class="muted">· ${ago(e.t)}</span></li>`).join('')}</ul>`;
}

/* ---------- search (header + pickers) ---------- */
function searchPeople(q, n = 12) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const words = q.split(/\s+/);
  const out = [];
  for (const id in T.people) {
    const p = P(id); const hay = (fullName(p) + ' ' + p.nick + ' ' + p.birthSurname).toLowerCase();
    if (words.every(w => hay.includes(w))) out.push({ id, score: (hay.startsWith(q) ? 0 : 1) + (IX.blood.has(id) ? 0 : .5) + (IX.depth[id] || 0) * .01 });
  }
  return out.sort((a, b) => a.score - b.score).slice(0, n).map(x => x.id);
}
function attachSearch(input, box, onPick) {
  let hi = 0, list = [];
  const draw = () => {
    list = searchPeople(input.value);
    box.innerHTML = list.map((id, i) => `<button type="button" role="option" class="${i === hi ? 'hi' : ''}" data-pickid="${id}"><b>${esc(fullName(id))}</b> <span class="muted">${esc(lifeYears(id))}</span><span class="ctx">${esc(context(id) || relToMe(id))}</span></button>`).join('') || (input.value.trim() ? '<p class="muted" style="padding:8px 14px;margin:0">No one by that name.</p>' : '');
    box.classList.toggle('open', !!input.value.trim()); input.setAttribute('aria-expanded', box.classList.contains('open'));
  };
  input.addEventListener('input', () => { hi = 0; draw(); });
  input.addEventListener('focus', () => { if (input.value.trim()) draw(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { hi = Math.min(hi + 1, list.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hi = Math.max(hi - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter' && list[hi]) { e.preventDefault(); box.classList.remove('open'); onPick(list[hi]); }
    else if (e.key === 'Escape') box.classList.remove('open');
  });
  box.addEventListener('mousedown', e => e.preventDefault());
  box.addEventListener('click', e => { const b = e.target.closest('[data-pickid]'); if (b) { box.classList.remove('open'); onPick(b.dataset.pickid); } });
  input.addEventListener('blur', () => setTimeout(() => box.classList.remove('open'), 150));
}

/* ---------- connection operations ---------- */
async function addChild(uid) {
  const u = T.unions[uid]; if (!u) return;
  const par = u.partners.map(x => P(x).given).join(' & ');
  const sur = u.partners.map(x => P(x).surname).find(Boolean) || '';
  const r = await askPerson(`Add a child of ${par}`, null, { surname: '', existing: true });
  if (!r) return;
  if (r.id) {
    const old = parentUnion(r.id); const ch = [];
    if (old) ch.push(putU({ ...old, children: old.children.filter(c => c !== r.id) }));
    ch.push(putU({ ...u, children: [...u.children.filter(c => c !== r.id), r.id] }));
    ch.push(putP({ ...P(r.id), parentsUncertain: false }));
    commit(ch, `Made ${shortName(r.id)} a child of ${par}`); return r.id;
  } else {
    const p = newPerson({ given: r.given, surname: r.surname, birth: r.birth, sex: r.sex });
    commit([putP(p), putU({ ...u, children: [...u.children, p.id] })], `Added ${shortName(p)} as a child of ${par}`); return p.id;
  }
}
async function addChildTo(pid) { // person with no union yet
  let us = unionsOf(pid);
  if (us.length === 1) return addChild(us[0].id);
  const u = newUnion([pid]); commit([putU(u)], `Started a family for ${shortName(pid)}`, { toast: false, undo: false }); return addChild(u.id);
}
async function addSpouse(pid) {
  const r = await askPerson(`Add a spouse or partner for ${shortName(pid)}`, null);
  if (!r) return;
  let other, ch = [];
  if (r.id) { if (r.id === pid) return; other = r.id; } else { const p = newPerson({ given: r.given, surname: r.surname, birth: r.birth, sex: r.sex }); other = p.id; ch.push(putP(p)); }
  // reuse a single-parent family (children with "unknown other parent") if there is one
  const solo = unionsOf(pid).find(u => u.partners.length === 1);
  if (solo && !unionsOf(pid).some(u => u.partners.length > 1)) ch.push(putU({ ...solo, partners: [pid, other] }));
  else ch.push(putU(newUnion([pid, other])));
  commit(ch, `Added ${r.id ? shortName(r.id) : r.given + (r.surname ? ' ' + r.surname : '')} as spouse/partner of ${shortName(pid)}`); return other;
}
async function addParent(pid) {
  const pu = parentUnion(pid);
  if (pu && pu.partners.length >= 2) return toast('Two parents are already recorded. Edit them from their own cards.');
  const r = await askPerson(`Add a parent of ${shortName(pid)}`, null, { surname: P(pid).surname });
  if (!r) return;
  const ch = []; let parId = r.id;
  if (!parId) { const p = newPerson({ given: r.given, surname: r.surname, birth: r.birth, sex: r.sex }); parId = p.id; ch.push(putP(p)); }
  if (pu) ch.push(putU({ ...pu, partners: [...pu.partners, parId] }));
  else ch.push(putU(newUnion([parId], [pid])));
  commit(ch, `Added ${r.id ? shortName(r.id) : r.given} as a parent of ${shortName(pid)}`); return parId;
}
function setParents(cid, uid) {
  const u = T.unions[uid], old = parentUnion(cid); const ch = [];
  if (old && old.id !== uid) ch.push(putU({ ...old, children: old.children.filter(c => c !== cid) }));
  if (!u.children.includes(cid)) { const ord = old && old.id !== uid ? u.children.concat(cid) : u.children; ch.push(putU({ ...u, children: ord })); }
  ch.push(putP({ ...P(cid), parentsUncertain: false }));
  commit(ch, `Confirmed ${shortName(cid)} is a child of ${u.partners.map(x => P(x).given).join(' & ')}`);
}
async function changeParents(cid) {
  const pid = await pickPerson(`Who is one of ${P(cid).given}’s parents?`);
  if (!pid || pid === cid) return;
  let us = unionsOf(pid);
  if (!us.length) { const u = newUnion([pid]); commit([putU(u)], `Started a family for ${shortName(pid)}`, { toast: false, undo: false }); us = [u]; }
  if (us.length === 1) return setParents(cid, us[0].id);
  openDlg(dlg2, `<div class="dh"><h3>Which couple?</h3></div><div class="db">${us.map(u => `<button class="btn" style="display:block;width:100%;margin:6px 0;text-align:left" data-u="${u.id}">${esc(u.partners.map(shortName).join(' & '))}</button>`).join('')}</div><div class="df"><button class="btn" data-x>Cancel</button></div>`);
  dlg2.onclick = e => { const b = e.target.closest('[data-u]'); if (b) { closeDlg(dlg2); setParents(cid, b.dataset.u); } else if (e.target.closest('[data-x]')) closeDlg(dlg2); };
}
async function deletePerson(pid) {
  const p = P(pid); const kids = childrenOf(pid).length;
  if (pid === IX.root) return toast('The founders can’t be deleted.');
  if (!(await confirmBox(`Delete <b>${esc(fullName(p))}</b> from the tree?${kids ? ` Their ${kids} child${kids > 1 ? 'ren stay' : ' stays'} in the tree.` : ''} You can undo this right after.`, 'Delete', true))) return;
  const ch = [delP(pid)];
  for (const u of Object.values(T.unions)) {
    if (!u.partners.includes(pid) && !u.children.includes(pid)) continue;
    const nu = { ...u, partners: u.partners.filter(x => x !== pid), children: u.children.filter(x => x !== pid) };
    ch.push(!nu.partners.length && !nu.children.length || (!nu.children.length && nu.partners.length < 2) ? delU(u.id) : putU(nu));
  }
  closeDlg(dlg); if (state.sel === pid) state.sel = parentsOf(pid)[0] || IX.root; closePanel();
  if (p.photoV) deleteFullPhoto(pid);
  commit(ch, `Deleted ${shortName(p)}`);
}
function moveChild(uid, cid, dir) {
  const u = T.unions[uid]; const c = [...u.children]; const i = c.indexOf(cid), j = i + dir;
  if (j < 0 || j >= c.length) return; [c[i], c[j]] = [c[j], c[i]];
  commit([putU({ ...u, children: c })], `Reordered ${P(uid && u.partners[0]) ? P(u.partners[0]).given : ''}’s children`, { toast: false });
}
async function unlinkChild(uid, cid) {
  const u = T.unions[uid];
  if (!(await confirmBox(`Remove ${esc(shortName(cid))} from this family? They stay in the tree (under “Fill in the gaps”) so you can reconnect them.`, 'Remove link'))) return;
  commit([putU({ ...u, children: u.children.filter(c => c !== cid) })], `Unlinked ${shortName(cid)} from ${u.partners.map(x => P(x).given).join(' & ')}`);
}
async function unlinkSpouse(uid, pid) {
  const u = T.unions[uid]; const other = spousesIn(u, pid)[0];
  if (!(await confirmBox(`Remove the marriage/partnership between ${esc(shortName(pid))} and ${esc(shortName(other))}?${u.children.length ? ' Their children stay with ' + esc(P(pid).given) + '.' : ''}`, 'Remove'))) return;
  const ch = [];
  if (u.children.length) ch.push(putU({ ...u, partners: [pid] })); else ch.push(delU(uid));
  // a spouse who is now connected to nobody else is removed too
  if (!IX.blood.has(other) && !IX.parentU[other] && unionsOf(other).length === 1) ch.push(delP(other));
  commit(ch, `Removed ${shortName(other)} as spouse of ${shortName(pid)}`);
}

/* ---------- "Add a relative": pick a person, pick how they're related, add ---------- */
function chooseCouple(pid, title) { // -> union id, or null

async function addRelative() {
  if (!T) return;
  const me = LS.get('me');
  const start = state.view === 'family' && state.sel && P(state.sel) ? state.sel : (state.panel && P(state.panel) ? state.panel : null);
  const quick = [...new Set([start, me].filter(x => x && P(x)))];
  const pid = await new Promise(res => {
    openDlg(dlg, `<div class="dh"><h3>Add a relative</h3><button class="iconbtn" data-x aria-label="Close">✕</button></div><div class="db" style="min-height:340px">
      <p style="margin-top:0"><b>Step 1.</b> Who is the new person related to?</p>
      ${quick.length ? `<div class="grid" style="margin-bottom:12px">${quick.map(x => `<button class="pc" data-arp="${x}" style="--bc:${brColor(x)}">${avatar(x)}<span class="t"><b>${esc(shortName(x))}</b><small>${x === me ? 'you' : esc(context(x) || lifeYears(x))}</small></span></button>`).join('')}</div><p class="muted" style="margin:0 0 6px">…or someone else:</p>` : ''}
      <div class="search" style="max-width:none"><input id="arQ" placeholder="Type their name…" autocomplete="off" style="padding-left:14px"${quick.length ? '' : ' autofocus'}><div class="results" id="arR"></div></div></div>`);
    let done = false; const fin = v => { if (done) return; done = true; dlg.onclick = null; res(v); };
    attachSearch($('#arQ'), $('#arR'), id => fin(id));
    dlg.onclick = e => { const b = e.target.closest('[data-arp]'); if (b) fin(b.dataset.arp); else if (e.target.closest('[data-x]')) { closeDlg(dlg); fin(null); } };
    dlg.onclose = () => fin(null);
  });
  if (!pid) return;
  const name = P(pid).given, pu = parentUnion(pid);
  const how = await new Promise(res => {
    const opt = (k, t, d) => `<button class="btn" data-how="${k}" style="display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px"><span style="font-size:1.05rem">${t}</span><br><span class="muted" style="font-weight:400;font-size:.88rem">${d}</span></button>`;
    openDlg(dlg, `<div class="dh"><h3>Add a relative</h3><button class="iconbtn" data-x aria-label="Close">✕</button></div><div class="db">
      <p style="margin-top:0"><b>Step 2.</b> The new person is ${esc(shortName(pid))}’s…</p>
      ${opt('child', 'Child', `A son or daughter of ${esc(name)}`)}
      ${opt('spouse', 'Spouse or partner', `Husband, wife or partner of ${esc(name)}, current or former`)}
      ${opt('sibling', 'Brother or sister', pu ? `Another child of ${esc(pu.partners.map(x => P(x).given).join(' & '))}` : `${esc(name)}’s parents aren’t in the tree yet, so you’ll add a parent first`)}
      ${opt('parent', 'Parent', pu && pu.partners.length >= 2 ? `Both of ${esc(name)}’s parents are already recorded` : `Mother or father of ${esc(name)}`)}
      <button class="btn sm" data-back style="margin-top:6px">← Choose a different person</button></div>`);
    let done = false; const fin = v => { if (done) return; done = true; dlg.onclick = null; closeDlg(dlg); res(v); };
    dlg.onclick = e => { const b = e.target.closest('[data-how]'); if (b) fin(b.dataset.how); else if (e.target.closest('[data-back]')) fin('back'); else if (e.target.closest('[data-x]')) fin(null); };
    dlg.onclose = () => fin(null);
  });
  if (how === 'back') return addRelative();
  let newId = null;
  if (how === 'child') {
    const uid = await chooseCouple(pid, `Which couple is the child from?`);
    if (uid === 'none') newId = await addChildTo(pid); else if (uid) newId = await addChild(uid);
  } else if (how === 'spouse') newId = await addSpouse(pid);
  else if (how === 'parent') newId = await addParent(pid);
  else if (how === 'sibling') {
    if (pu) newId = await addChild(pu.id);
    else { toast(`First add one of ${name}’s parents, then the brother or sister.`); newId = await addParent(pid); }
  }
  if (newId && P(newId)) goPerson(newId);
}

function saveEditor(close = true) {
  const p = P(editId); if (!p) return closeDlg(dlg);
  const f = $('#pf'); const np = { ...p };
  for (const k of ['given', 'middle', 'surname', 'birthSurname', 'nick', 'sex', 'birth', 'birthPlace', 'death', 'deathPlace', 'notes']) np[k] = (f.elements[k].value || '').trim();
  np.deceased = f.elements.deceased.checked || !!np.death;
  if (!np.given) { f.elements.given.focus(); return; }
  if (photoData !== undefined) np.photo = photoData;
  if (photoFull === null) { if (p.photoV) deleteFullPhoto(editId); np.photoV = ''; }
  else if (photoFull) { np.photoV = Date.now().toString(36); saveFullPhoto(editId, photoFull, np.photoV); }
  const ch = [];
  if (JSON.stringify(np) !== JSON.stringify(p)) ch.push(putP(np));
  // marriage fields
  $$('#dlg .conn[data-union]').forEach(c => {
    const u = T.unions[c.dataset.union]; if (!u) return; const nu = { ...u };

    if (JSON.stringify(nu) !== JSON.stringify(u)) ch.push(putU(nu));

}
dlg.addEventListener('click', async e => {
  const b = e.target.closest('[data-ed]'); if (!b) return;
  const a = b.dataset.ed, id = editId;

  if (a === 'photo') return $('#photoIn').click();
  if (a === 'nophoto') { photoData = ''; photoFull = null; const av = $('#pfAv'); av.style.backgroundImage = ''; av.textContent = initials(P(id)); av.removeAttribute('data-zoom'); return; }
  if (a === 'recrop') { const full = photoFull || await loadFullPhoto(id); if (!full) return toast('The full photo isn’t available on this device yet.'); const r = await openCropper(full, false); if (r) setEditorPhoto(r.thumb, photoFull); return; }
  if (a === 'delete') return deletePerson(id);
  saveEditor(false);  // keep typed changes before touching links
  if (a === 'changeParents') await changeParents(id);
  else if (a === 'addParent') await addParent(id);
  else if (a === 'addSpouse') await addSpouse(id);
  else if (a === 'addChild') await addChild(b.dataset.u);
  else if (a === 'addChildNew') await addChildTo(id);
  else if (a === 'unlinkSpouse') await unlinkSpouse(b.dataset.u, id);
  else if (a === 'unlinkChild') await unlinkChild(b.dataset.u, b.dataset.c);
  else if (a === 'up' || a === 'down') moveChild(b.dataset.u, b.dataset.c, a === 'up' ? -1 : 1);
  if (P(id)) openEditor(id);
});

/* ---------- "who are you?" ---------- */

async function connect(c, quiet) {
  conn = c; LS.set('conn', c);
  const cached = LS.get('cache.' + c.key);
  if (cached && !T) { T = normTree(cached); afterChange(); show(state.view === 'welcome' ? 'tree' : state.view); }
  setStatus('busy');
  try {
    const data = await fetchShared();
    if (data) { T = normTree(data); for (const p of pending) if (p.path) setAt(p.path.split('/'), p.v); saveLocal(); }
    else if (!T) { toast('That family link points to an empty tree.'); }
    else await uploadAll();
    afterChange(); show(state.view === 'welcome' ? 'tree' : state.view);
    openStream(); flush();
    if (!quiet) toast('Connected to the family tree');
  } catch (err) {
    setStatus('off');
    if (!T) { renderWelcome('Couldn’t reach the family tree. Check your internet connection and try again.'); show('welcome'); }
    setTimeout(() => connect(c, true), 10000);
  }
}

function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

function gedcom() {
  const ids = {}; let i = 0, j = 0; for (const id in T.people) ids[id] = '@I' + (++i) + '@'; const fid = {}; for (const id in T.unions) fid[id] = '@F' + (++j) + '@';
  const gd = s => { s = String(s).trim(); return s.replace(/^(c\.|ca\.?|circa|about|abt\.?)\s*/i, 'ABT ').replace(/^before\s*/i, 'BEF ').replace(/^after\s*/i, 'AFT ').toUpperCase(); };
  const L = ['0 HEAD', '1 SOUR GoldsteinFamilyTree', '1 GEDC', '2 VERS 5.5.1', '2 FORM LINEAGE-LINKED', '1 CHAR UTF-8'];
  for (const id in T.people) {
    const p = T.people[id];
    L.push(`0 ${ids[id]} INDI`, `1 NAME ${[p.given, p.middle].filter(Boolean).join(' ')} /${p.birthSurname || p.surname}/`, `2 GIVN ${[p.given, p.middle].filter(Boolean).join(' ')}`);
    if (p.surname || p.birthSurname) L.push(`2 SURN ${p.birthSurname || p.surname}`); if (p.nick) L.push(`2 NICK ${p.nick}`);
    if (p.birthSurname && p.surname && p.surname !== p.birthSurname) L.push(`1 NAME ${p.given} /${p.surname}/`, '2 TYPE aka');
    L.push(`1 SEX ${p.sex === 'F' ? 'F' : p.sex === 'M' ? 'M' : 'U'}`);
    if (p.birth || p.birthPlace) { L.push('1 BIRT'); if (p.birth) L.push('2 DATE ' + gd(p.birth)); if (p.birthPlace) L.push('2 PLAC ' + p.birthPlace); }
    if (p.deceased) { L.push(p.death || p.deathPlace ? '1 DEAT' : '1 DEAT Y'); if (p.death) L.push('2 DATE ' + gd(p.death)); if (p.deathPlace) L.push('2 PLAC ' + p.deathPlace); }
    if (p.notes) p.notes.split('\n').forEach((ln, k) => L.push((k ? '2 CONT ' : '1 NOTE ') + ln));
    for (const u of unionsOf(id)) L.push('1 FAMS ' + fid[u.id]);
    if (IX.parentU[id]) L.push('1 FAMC ' + fid[IX.parentU[id]]);
  }
  for (const id in T.unions) {
    const u = T.unions[id]; L.push(`0 ${fid[id]} FAM`);
    const [a, b] = u.partners; const role = (x, dflt) => P(x).sex === 'F' ? 'WIFE' : P(x).sex === 'M' ? 'HUSB' : dflt;
    if (a) L.push(`1 ${role(a, 'HUSB')} ${ids[a]}`); if (b) L.push(`1 ${role(b, a && role(a, 'HUSB') === 'WIFE' ? 'HUSB' : 'WIFE')} ${ids[b]}`);
    for (const c of u.children) L.push('1 CHIL ' + ids[c]);
    if (u.married || u.place) { L.push('1 MARR'); if (u.married) L.push('2 DATE ' + gd(u.married)); if (u.place) L.push('2 PLAC ' + u.place); }
    if (u.ended === 'divorced') { L.push('1 DIV'); if (u.endDate) L.push('2 DATE ' + gd(u.endDate)); }
  }
  L.push('0 TRLR'); return L.join('\n') + '\n';
}
function chartSVG() {
  const keep = state.collapsed; state.collapsed = new Set(); renderTree();
  const g = $('#treeG'); const bb = g.getBBox();
  const css = `.link{fill:none;stroke-width:1.6;opacity:.6}.box{fill:#fffdf8;stroke:#d8ccb6}.nm{font:600 14px 'IBM Plex Sans',Helvetica,Arial,sans-serif;fill:#2a231d}.yr{font:11.5px 'IBM Plex Sans',Helvetica,Arial,sans-serif;fill:#6b6056}.sp{font:12px 'IBM Plex Sans',Helvetica,Arial,sans-serif;fill:#4a4038}.tg{display:none}.unc{font:700 12px sans-serif;fill:#a4501f}`;
  const vars = getComputedStyle(document.documentElement);
  let inner = g.innerHTML.replace(/var\((--b\w)\)/g, (m, v) => vars.getPropertyValue(v).trim());
  const out = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="${bb.x - 40} ${bb.y - 90} ${bb.width + 80} ${bb.height + 130}" width="${bb.width + 80}" height="${bb.height + 130}"><style>${css}</style><rect x="${bb.x - 40}" y="${bb.y - 90}" width="${bb.width + 80}" height="${bb.height + 130}" fill="#f6f1e7"/><text x="${bb.x}" y="${bb.y - 40}" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#2a231d">${esc(T.meta.title)}</text><g>${inner}</g></svg>`;
  state.collapsed = keep; renderTree();
  return out;
}

  const np = { ...p, [f]: v }; if (f === 'death' && v) np.deceased = true;
  q.classList.add('saved');
  const keepFocus = document.activeElement;
  commit([putP(np)], `Set ${shortName(p)}’s ${f === 'birth' ? 'birth' : 'death'} date to ${v || '(blank)'}`, { toast: false });
  if (keepFocus && keepFocus !== q && keepFocus.matches('input[data-q]')) { const r = keepFocus.closest('tr').dataset.id, ff = keepFocus.dataset.q; const again = $(`#helpPad tr[data-id="${r}"] input[data-q="${ff}"]`); if (again) again.focus(); }
});
window.addEventListener('online', () => flush());
window.addEventListener('resize', () => { if (state.view === 'timeline') renderTimeline(); });

/* ---------- start-up ---------- */
function joinFromHash() {
  const m = location.hash.match(/#join=([^/]+)\/([\w-]+)/); if (!m) return null;
  history.replaceState(null, '', location.pathname + location.search);
  return { db: dbFromLink(m[1]), key: m[2] };
}
window.addEventListener('hashchange', () => {
  const c = joinFromHash(); if (!c || (conn && conn.key === c.key)) return;
  if (es) es.close(); if (conn) LS.del('cache.' + conn.key); pending = []; LS.set('pending', []); T = null; connect(c);
});
(function boot() {
  if (LS.get('big')) document.body.classList.add('big');
  treeVP = Viewport($('#treeSvg'), $('#treeG'));
  fanVP = Viewport($('#fanSvg'), $('#fanG'));
  state.sel = LS.get('sel');
  // 1. arriving with a family link?
  const c = joinFromHash();
  if (c) { if (!conn || conn.key !== c.key) { if (conn) LS.del('cache.' + conn.key); pending = []; LS.set('pending', []); } conn = c; LS.set('conn', c); }
  if (conn) { const cached = LS.get('cache.' + conn.key); if (cached) T = normTree(cached); }
  // 2. otherwise: this device's own copy, or the starting data that sits next to this page on Adam's Mac
  else if (LS.get('tree')) T = normTree(LS.get('tree'));
  else if (window.FAMILY_SEED) { T = normTree(clone(window.FAMILY_SEED)); LS.set('tree', T); }
  setStatus(conn ? 'busy' : 'local');
  if (T) { afterChange(); show(state.view === 'welcome' ? 'tree' : state.view); }
  else { renderWelcome(); show('welcome'); }
  if (conn) connect(conn, true);
})();

/* ================================================================
   Photos: crop (drag + zoom) when adding, full-size viewer on tap.
   The small square crop lives on the person (person.photo, ~20 KB) so
   the tree stays light. The full-size original is stored apart and
   only loaded when someone opens it:
     shared tree: <db>/trees/<key>_photos/<person id> = {v, data}
     this device: IndexedDB "gft-photos" (also a cache for shared ones)
   person.photoV is the version of the full photo (changes on replace).
   ================================================================ */
const IDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('gft-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('p', mode); const req = fn(t.objectStore('p')); t.oncomplete = () => res(req.result); t.onerror = () => rej(t.error); }); };
  return { get: k => run('readonly', s => s.get(k)).catch(() => null), put: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => null), del: k => run('readwrite', s => s.delete(k)).catch(() => null) };
})();
const photoKey = pid => (conn ? conn.key : 'local') + ':' + pid;
const photoUrl = pid => `${conn.db}/trees/${conn.key}_photos/${pid}.json`;

function saveFullPhoto(pid, data, v) {
  IDB.put(photoKey(pid), { v, data });
  if (conn) { pending.push({ abs: photoUrl(pid), v: { v, data } }); LS.set('pending', pending); flush(); }
}
function deleteFullPhoto(pid) {
  IDB.del(photoKey(pid));
  if (conn) { pending.push({ abs: photoUrl(pid), v: null }); LS.set('pending', pending); flush(); }
}
// when a tree made on this device is shared, send along the full-size photos kept here
async function shareLocalPhotos() {
  for (const p of Object.values(T.people)) {
    if (!p.photoV) continue;
    const d = await IDB.get('local:' + p.id);
    if (d && d.data) saveFullPhoto(p.id, d.data, d.v);
  }
}
async function loadFullPhoto(pid) {
  const p = P(pid); if (!p || !p.photoV) return null;
  const cached = await IDB.get(photoKey(pid));
  if (cached && cached.v === p.photoV) return cached.data;
  if (conn) {
    try { const r = await fetch(photoUrl(pid)); const j = r.ok ? await r.json() : null; if (j && j.data) { IDB.put(photoKey(pid), j); return j.data; } } catch (e) {}
  }
  return cached ? cached.data : null;
}

/* ---------- cropper ---------- */
// src: image URL/data URL.  makeFull: also return a downsized full-size copy.
function openCropper(src, makeFull) {
  return new Promise(resolve => {
    const img = new Image();
    img.onerror = () => { toast('Couldn’t read that photo.'); resolve(null); };
    img.onload = () => {
      const W = img.naturalWidth, H = img.naturalHeight;
      openDlg(dlg2, `<div class="dh"><h3>Position the photo</h3><button class="iconbtn" data-c="x" aria-label="Cancel">✕</button></div>
        <div class="db"><p class="muted" style="margin-top:0">Drag to move it. Zoom with the slider, by pinching, or with the scroll wheel.</p>
        <div class="crop" id="crop"><img id="cropImg" alt="" draggable="false"><div class="cropgrid"></div></div>
        <div class="zoomrow"><button class="btn sm" data-c="out" aria-label="Zoom out">−</button><input type="range" id="cropZ" min="1" max="6" step="0.01" value="1" aria-label="Zoom"><button class="btn sm" data-c="in" aria-label="Zoom in">+</button></div></div>
        <div class="df"><button class="btn" data-c="x">Cancel</button><button class="btn primary" data-c="ok">Use this photo</button></div>`);
      const box = $('#crop'), im = $('#cropImg'), zr = $('#cropZ');
      im.src = src;
      let S = box.clientWidth, base = S / Math.min(W, H), z = 1, ox, oy;
      const scale = () => base * z;
      const clamp = () => { const s = scale(); ox = Math.min(0, Math.max(S - W * s, ox)); oy = Math.min(0, Math.max(S - H * s, oy)); };
      const draw = () => { clamp(); im.style.transform = `translate(${ox}px,${oy}px) scale(${scale()})`; zr.value = z; };
      ox = (S - W * base) / 2; oy = (S - H * base) / 2; draw();
      const zoomTo = (nz, cx = S / 2, cy = S / 2) => { nz = Math.min(6, Math.max(1, nz)); const r = nz / z; ox = cx - (cx - ox) * r; oy = cy - (cy - oy) * r; z = nz; draw(); };
      const local = e => { const b = box.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
      const pts = new Map(); let pinch = null;
      box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e)); pinch = null; box.classList.add('drag'); });
      box.addEventListener('pointermove', e => {
        if (!pts.has(e.pointerId)) return;
        const p = local(e), prev = pts.get(e.pointerId); pts.set(e.pointerId, p);
        if (pts.size === 1) { ox += p[0] - prev[0]; oy += p[1] - prev[1]; draw(); }
        else if (pts.size === 2) {
          const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]), c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          if (pinch) { ox += c[0] - pinch.c[0]; oy += c[1] - pinch.c[1]; zoomTo(z * d / pinch.d, c[0], c[1]); }
          pinch = { d, c };
        }
      });
      const up = e => { pts.delete(e.pointerId); pinch = null; if (!pts.size) box.classList.remove('drag'); };
      box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
      box.addEventListener('wheel', e => { e.preventDefault(); const [cx, cy] = local(e); zoomTo(z * Math.exp(-e.deltaY * 0.002), cx, cy); }, { passive: false });
      zr.addEventListener('input', () => zoomTo(+zr.value));
      let done = false;
      const fin = v => { if (done) return; done = true; dlg2.onclick = null; dlg2.onclose = null; closeDlg(dlg2); resolve(v); };
      dlg2.onclick = e => {
        const b = e.target.closest('[data-c]'); if (!b) return;
        const c = b.dataset.c;
        if (c === 'in') return zoomTo(z * 1.25); if (c === 'out') return zoomTo(z / 1.25);
        if (c === 'x') return fin(null);
        // crop -> 320 px square thumbnail
        const T = 320, cv = document.createElement('canvas'); cv.width = cv.height = T;
        const s = scale(); cv.getContext('2d').drawImage(img, -ox / s, -oy / s, S / s, S / s, 0, 0, T, T);
        const out = { thumb: cv.toDataURL('image/jpeg', 0.8), full: undefined };
        if (makeFull) { // keep the whole picture too, at most 1600 px on the long side
          const k = Math.min(1, 1600 / Math.max(W, H)), fc = document.createElement('canvas');
          fc.width = Math.round(W * k); fc.height = Math.round(H * k);
          fc.getContext('2d').drawImage(img, 0, 0, fc.width, fc.height);
          out.full = fc.toDataURL('image/jpeg', 0.82);
        }
        fin(out);
      };
      dlg2.onclose = () => fin(null);
    };
    img.src = src;
  });
}

/* ---------- full-size viewer ---------- */
const lb = $('#lightbox');
async function openLightbox(pid) {
  const p = P(pid); if (!p || !p.photo) return;
  lb.innerHTML = `<button class="iconbtn lbx" data-lbx aria-label="Close">✕</button>
    <figure><img src="${p.photo}" alt="Photo of ${esc(fullName(p))}" title="Tap to see it at full size"><figcaption><b>${esc(fullName(p))}</b> ${esc(lifeYears(p))}<span id="lbNote">${p.photoV ? ' · loading full photo…' : ''}</span></figcaption></figure>`;
  if (!lb.open) lb.showModal();
  if (!p.photoV) return;
  const full = await loadFullPhoto(pid);
  const note = $('#lbNote');
  if (full && lb.open) { const im = lb.querySelector('img'); im.src = full; if (note) note.textContent = ''; }
  else if (note) note.textContent = ' · only the cropped photo is available';
}
lb.addEventListener('click', e => {
  if (e.target.closest('[data-lbx]') || e.target === lb || e.target.tagName === 'FIGURE') return lb.close();
  const im = e.target.closest('img'); if (im) lb.classList.toggle('actual');
});
lb.addEventListener('close', () => lb.classList.remove('actual'));
document.addEventListener('click', e => { const z = e.target.closest('[data-zoom]'); if (z) { e.preventDefault(); e.stopPropagation(); openLightbox(z.dataset.zoom); } }, true);
document.addEventListener('keydown', e => { const z = e.target.closest && e.target.closest('[data-zoom]'); if (z && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openLightbox(z.dataset.zoom); } });
</script>
